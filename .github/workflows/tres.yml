name: Ejecución Manual

# Aquí está la clave: al usar workflow_dispatch, solo se ejecutará cuando tú lo decidas
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno donde desplegar'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      motivo:
        description: 'Breve motivo de la ejecución'
        required: false
        type: string

jobs:
  mi_tarea:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código del repositorio
        uses: actions/checkout@v4

      - name: Saludo inicial
        run: |
          echo "¡Hola! Has ejecutado este flujo manualmente."
          echo "Entorno seleccionado: ${{ github.event.inputs.entorno }}"
          echo "Motivo: ${{ github.event.inputs.motivo }}"

      - name: Ejecutar tus comandos
        run: |
          echo "Aquí puedes poner los comandos que realmente quieres ejecutar..."
          # Ejemplo: npm run build o python script.py
